<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="276" r="148" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Alarm bells / top ears -->
  <path d="M148 116 L96 168" stroke="#818cf8" stroke-width="24" stroke-linecap="round" />
  <path d="M364 116 L416 168" stroke="#818cf8" stroke-width="24" stroke-linecap="round" />

  <!-- Feet -->
  <path d="M168 408 L136 448" stroke="#6366f1" stroke-width="20" stroke-linecap="round" />
  <path d="M344 408 L376 448" stroke="#6366f1" stroke-width="20" stroke-linecap="round" />

  <!-- Clock hands -->
  <path d="M256 196 V276 L316 306" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Heart / Loved one accent in center-top -->
  <path d="M256 142 C256 142 244 126 232 126 C218 126 208 136 208 150 C208 168 234 186 256 200 C278 186 304 168 304 150 C304 136 294 126 280 126 C268 126 256 142 256 142 Z" fill="#f43f5e" />
</svg>
