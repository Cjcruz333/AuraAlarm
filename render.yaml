services:
  - type: web
    name: auraalarm
    env: node
    plan: free
    buildCommand: npm ci --include=dev --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: node server/src/bootstrap.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
