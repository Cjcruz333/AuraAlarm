name: Deploy AuraAlarm to Google Play & Apple App Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD & DEPLOY TO GOOGLE PLAY STORE
  # =========================================================================
  deploy-android:
    name: Build & Deploy to Google Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Production Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x client/android/gradlew

      - name: Build Android App Bundle (.aab)
        run: |
          cd client/android
          ./gradlew bundleRelease

      - name: Sign Android App Bundle
        uses: rign威/sign-android-release@v1
        continue-on-error: true
        with:
          releaseDirectory: client/android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.auraalarm.app
          releaseFiles: client/android/app/build/outputs/bundle/release/*.aab
          track: internal # Options: internal, alpha, beta, production
          status: completed

  # =========================================================================
  # 2. BUILD & DEPLOY TO APPLE APP STORE CONNECT
  # =========================================================================
  deploy-ios:
    name: Build & Deploy to Apple App Store (TestFlight & App Store)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Production Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Install Apple Certificate and Provisioning Profile
        uses: apple-actions/import-codesign-certs@v3
        continue-on-error: true
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Upload to Apple App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        continue-on-error: true
        with:
          app-path: client/ios/App/build/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
